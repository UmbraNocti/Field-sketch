<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Field Sketch">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Field Sketch</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <h1>Field Sketch</h1>
        <button id="jobname" class="job" aria-label="Rename sketch">Untitled sketch</button>
      </div>
      <div class="bar-actions">
        <button id="undo" class="bar-btn" aria-label="Undo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L4 9l4 4M4 9h9a5 5 0 0 1 0 10H8"/></svg><span class="word">Undo</span></button>
        <button id="redo" class="bar-btn" aria-label="Redo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5l4 4-4 4M20 9h-9a5 5 0 0 0 0 10h5"/></svg><span class="word">Redo</span></button>
        <button id="fit" class="bar-btn" aria-label="Fit"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="word">Fit</span></button>
        <button id="open" class="bar-btn" aria-label="Open"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="word">Open</span></button>
        <button id="save" class="bar-btn" aria-label="Save"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></svg><span class="word">Save</span></button>
        <button id="new" class="bar-btn" aria-label="New"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="word">New</span></button>
        <input id="file" type="file" accept=".json,application/json,.fieldsketch" hidden>
      </div>
    </header>
    <main id="stage">
      <div id="canvasWrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
          <g id="scene"></g>
          <polyline id="preview" points=""></polyline>
        </svg>
        <div id="hint"></div>
        <div id="empty" hidden>
          <svg viewBox="0 0 120 80" width="120" height="80" aria-hidden="true"><path d="M14 66V14h70l22 22v30Z" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="7 6" stroke-linejoin="round"/><circle cx="14" cy="66" r="5" fill="currentColor"/></svg>
          <p>Draw the room outline</p>
        </div>
        <div id="corner" hidden></div>
        <div id="toast" role="status"></div>
      </div>
      <aside id="panel"></aside>
    </main>
    <div id="tray"></div>
    <nav id="tabs"></nav>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
